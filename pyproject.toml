[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-processor-python"
version = "0.1.0"
description = "Python components for unified-processor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.104.0",
    "pypdfium2>=5.10.1",
    "structlog>=26.1.0",
    "pillow>=12.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/utils"]
