[package]
name = "unified-processor-lib"
version = "0.1.0"
edition = "2021"
description = "Core library for unified content processing service"
license = "Proprietary"
authors = ["ConFuse Team"]

[lib]
name = "unified_processor_lib"
path = "lib.rs"

[dependencies]
# Vercel Runtime
vercel_runtime = { workspace = true }

# Extracted from confuse-common
jsonwebtoken = "10.4.0"
validator = { version = "0.20.0", features = ["derive"] }
rsa = "0.10.0-rc.18"
once_cell = "1.21.4"
tonic = { version = "0.11", features = ["transport", "codegen", "prost"] }
prost = "0.12"
prost-types = "0.12"

# Kafka for event streaming
rdkafka = { version = "0.39.0", features = ["naive-runtime", "cmake-build", "ssl-vendored"] }

# FalkorDB via Redis protocol
redis = { workspace = true }
bb8-redis = { workspace = true }

# Web framework
axum = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
futures-util = "0.3.32"
tower = { workspace = true }
tower-http = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database — PostgreSQL for metadata
sqlx = { workspace = true }

# HTTP client (for service calls, Azure Blob REST API, web scraping)
reqwest = { workspace = true }

# HTML parsing for web scraping
scraper = "0.27.0"
url = "2.5.8"

# Configuration
config = "0.15.24"
dotenvy = "0.15.7"

# PDF Extraction
pdf-extract = "0.10.0"

# Utils
num_cpus = "1.17.0"
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2.5"
anyhow = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
flate2 = "1.0"

# Concurrency
dashmap = "7.0.0-rc2"
lazy_static = "1.5.0"

# Temporary storage & AST
tempfile = "3.27.0"
sha2 = "0.11.0"
petgraph = { version = "0.8.3", features = ["serde-1"] }
strsim = "0.11.1"
fnv = "1.0.7"
walkdir = "2.5.0"
unicode-normalization = "0.1.25"
md5 = "0.8.0"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-c = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-kotlin = { package = "tree-sitter-kotlin-ng", version = "*" }
tree-sitter-scala = "0.26.0"
tree-sitter-bash = "0.25.1"
tree-sitter-html = "0.23.2"
tree-sitter-md = "0.5.3"
