[workspace]
members = [
    "src",
    "api/index",
    "api/process",
    "api/batch",
    "api/sync",
    "api/status",
    "api/local",
]
resolver = "2"

[workspace.dependencies]
# Shared dependencies for workspace members
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
vercel_runtime = "1.1"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
futures = "0.3.32"
uuid = { version = "1.23.3", features = ["v4", "v5", "v3", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "macros"] }
redis = { version = "0.25", features = ["tokio-comp", "tokio-rustls-comp"] }
bb8-redis = "0.15"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip", "brotli"] }
base64 = "0.22.1"
bytes = "1.12.0"
async-trait = "0.1.89"
regex = "1.12.4"
unified_processor_lib = { package = "unified-processor-lib", path = "src" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
